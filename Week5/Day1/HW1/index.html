<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Validator</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">

  <style>
    .has_required {
      color: #198754;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-6 my-5">
          <password-helper inline-template>
            <div class="form-group mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                id="password"
                type="password"
                class="form-control"
                placeholder="Password"
                v-model="password"
                autocomplete="new-password"
                aria-describedby="passwordHelp">
              <small id="passwordHelp" class="form-text text-muted d-block mt-2">
                Password should contain
                <span :class="has_minimum_length ? 'has_required' : ''">at least 8 characters</span>,
                <span :class="has_lowercase ? 'has_required' : ''">one lowercase letter</span>,
                <span :class="has_uppercase ? 'has_required' : ''">one uppercase letter</span>,
                <span :class="has_number ? 'has_required' : ''">one number</span>, and
                <span :class="has_special ? 'has_required' : ''">one special character</span>.
              </small>
            </div>
          </password-helper>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script>
    Vue.component('password-helper', {
      data() {
        return {
          password: '',
          has_minimum_length: false,
          has_number: false,
          has_lowercase: false,
          has_uppercase: false,
          has_special: false
        };
      },
      watch: {
        password() {
          this.has_minimum_length = this.password.length >= 8;
          this.has_number = /\d/.test(this.password);
          this.has_lowercase = /[a-z]/.test(this.password);
          this.has_uppercase = /[A-Z]/.test(this.password);
          this.has_special = /[^A-Za-z0-9]/.test(this.password);
        }
      }
    });

    var app = new Vue({
      el: '#app'
    });
  </script>
</body>
</html>
